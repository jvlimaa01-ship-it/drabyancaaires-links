<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dra. Byanca Aires</title>
<meta name="robots" content="noindex, nofollow" />

  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-TPTJ4R4B');

})();

<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fbf6f1;
    --cream-2: #f4ebe1;
    --brown-deep: #3a2a20;
    --brown-soft: #6b4f3f;
    --accent: #8a5a45;
    --accent-dark: #6f4636;
    --border: rgba(138, 90, 69, 0.18);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Poppins", sans-serif;
    color: var(--brown-deep);
    min-height: 100vh;
    background:
      radial-gradient(circle at 15% 0%, rgba(138,90,69,0.10) 0%, rgba(138,90,69,0) 45%),
      radial-gradient(circle at 100% 30%, rgba(138,90,69,0.08) 0%, rgba(138,90,69,0) 40%),
      linear-gradient(180deg, var(--cream) 0%, var(--cream-2) 100%);
    background-attachment: fixed;
    display: flex;
    justify-content: center;
    padding: 24px 16px 40px;
  }
  main {
    width: 100%;
    max-width: 480px;
  }

  /* Animações de entrada ao rolar */
  .reveal {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1), transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .reveal.is-visible {
    opacity: 1;
    transform: translateY(0);
  }
  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; transition: none; }
  }

  /* Desktop: hero fixo à esquerda, cards em coluna à direita, tudo em escala maior */
  @media (min-width: 860px) {
    body { padding: 56px 32px 64px; }
    main {
      max-width: 1240px;
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 56px;
      align-items: start;
    }
    .topbar { grid-column: 1 / -1; margin-bottom: 36px; }
    .wordmark .script { font-size: 2.4rem; }
    .wordmark .caps { font-size: 0.78rem; }
    .hero-card {
      position: sticky;
      top: 40px;
      margin-bottom: 0;
      aspect-ratio: auto;
      height: 958px; /* = 4 cards de 220px + 3 gaps de 26px, mesma altura da coluna de cards */
    }
    .hero-card-content { padding: 44px 36px 40px; }
    .hero-eyebrow { font-size: 1.5rem; }
    .hero-headline { font-size: 3.8rem; }
    .hero-sub { font-size: 1.1rem; margin-bottom: 26px; }
    .socials a { width: 44px; height: 44px; font-size: 0.9rem; }
    .links { gap: 26px; }
    .link-card { min-height: 220px; height: 220px; border-radius: 30px; }
    .link-card-text { padding: 36px 34px; }
    .link-card-text h3 { font-size: 1.85rem; margin-bottom: 12px; }
    .link-card-text p { font-size: 1.05rem; margin-bottom: 20px; }
    .link-card-cta { font-size: 1rem; }
  }

  /* Topo: logo tipográfico + menu/tema (visual, sem função) */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 18px;
  }
  .wordmark { text-align: center; }
  .wordmark .script {
    display: block;
    font-family: "Playfair Display", Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 1.7rem;
    color: var(--accent-dark);
    line-height: 1;
  }
  .wordmark .caps {
    display: block;
    margin-top: 5px;
    font-size: 0.62rem;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--brown-soft);
  }

  /* Hero: card grande com foto, headline editorial e social */
  .hero-card {
    position: relative;
    border-radius: 28px;
    overflow: hidden;
    aspect-ratio: 3/4;
    background-size: cover;
    background-position: center 18%;
    box-shadow: 0 16px 36px rgba(58, 42, 32, 0.24);
    margin-bottom: 18px;
  }
  .hero-card::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(58,42,32,0) 38%, rgba(58,42,32,0.9) 100%);
  }
  .hero-card-content {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 28px 24px 26px;
    z-index: 1;
    color: #fff;
    text-align: center;
  }
  .hero-eyebrow {
    font-size: 1.1rem;
    font-weight: 400;
    margin: 0;
  }
  .hero-headline {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 600;
    font-size: 2.6rem;
    line-height: 1;
    margin: 2px 0 6px;
  }
  .hero-sub {
    font-size: 0.92rem;
    opacity: 0.92;
    margin: 0 0 18px;
    line-height: 1.4;
  }
  .socials {
    display: flex;
    justify-content: center;
    gap: 10px;
  }
  .socials a {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.16);
    border: 1px solid rgba(255,255,255,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    text-decoration: none;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    backdrop-filter: blur(4px);
  }
  .socials a:hover { background: rgba(255,255,255,0.28); }

  /* Pilha de cards, um destino por bloco, full width */
  .links {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .link-card {
    position: relative;
    border-radius: 24px;
    overflow: hidden;
    text-decoration: none;
    color: var(--brown-deep);
    background: #fff;
    border: 1px solid var(--border);
    box-shadow: 0 8px 22px rgba(58, 42, 32, 0.1);
    display: flex;
    min-height: 168px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .link-card::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.55) 48%, rgba(255,255,255,0.05) 58%, transparent 70%);
    transform: translateX(-130%);
    animation: card-shine 5s ease-in-out infinite;
  }
  .link-card:nth-child(2)::before { animation-delay: 0.6s; }
  .link-card:nth-child(3)::before { animation-delay: 1.2s; }
  .link-card:nth-child(4)::before { animation-delay: 1.8s; }
  @keyframes card-shine {
    0% { transform: translateX(-130%); }
    18% { transform: translateX(130%); }
    100% { transform: translateX(130%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .link-card::before { animation: none; display: none; }
  }
  .link-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(58, 42, 32, 0.16);
  }
  .link-card-text {
    position: relative;
    z-index: 1;
    padding: 24px 22px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    width: 60%;
  }
  .link-card-text h3 {
    font-family: "Playfair Display", Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 1.35rem;
    margin: 0 0 8px;
    color: var(--accent-dark);
  }
  .link-card-text p {
    font-size: 0.86rem;
    line-height: 1.5;
    margin: 0 0 14px;
    color: var(--brown-soft);
  }
  .link-card-cta {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.86rem;
    font-weight: 600;
    color: var(--accent);
  }
  .link-card-photo {
    position: relative;
    width: 40%;
    background-size: cover;
    background-position: center 15%;
    flex: 0 0 40%;
  }
  .link-card-photo-empty {
    background: linear-gradient(135deg, var(--cream-2), var(--border));
  }
  .link-card-date-badge {
    position: absolute;
    top: 12px;
    right: 12px;
    padding: 6px 13px;
    border-radius: 999px;
    background: linear-gradient(135deg, #d9a94f, #b8822f);
    color: #fff;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    box-shadow: 0 6px 14px rgba(184, 130, 47, 0.45);
  }
  .link-card-video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    object-position: center center;
    display: block;
  }
  .link-card.is-soon {
    cursor: default;
  }
  .link-card.is-soon .link-card-text {
    opacity: 0.75;
  }
  .link-card.is-soon .link-card-photo::after {
    content: "Em breve";
    position: absolute;
    top: 12px;
    right: 12px;
    padding: 5px 12px;
    border-radius: 999px;
    background: rgba(58, 42, 32, 0.72);
    backdrop-filter: blur(3px);
    color: #fff;
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .link-card.is-soon .link-card-cta {
    color: var(--brown-soft);
  }

  footer {
    margin-top: 32px;
    text-align: center;
    font-size: 0.72rem;
    color: var(--brown-soft);
    opacity: 0.7;
  }

  .cookie-banner {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 9999;
    background: var(--brown-deep);
    color: var(--cream);
    padding: 16px 0;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
  }
  .cookie-banner-inner {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }
  .cookie-banner p {
    margin: 0;
    font-size: 0.8rem;
    line-height: 1.5;
    color: var(--cream);
    flex: 1 1 260px;
  }
  .cookie-banner-actions { display: flex; align-items: center; gap: 16px; flex: 0 0 auto; }
  .cookie-banner #cookie-accept {
    padding: 10px 22px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 0.82rem;
    background: #fff;
    color: var(--brown-deep);
    border: none;
    cursor: pointer;
  }
  .cookie-reject-link {
    background: none; border: none; padding: 0;
    color: rgba(251,246,241,0.5);
    font-size: 0.72rem;
    text-decoration: none;
    cursor: pointer;
  }
  .cookie-reject-link:hover, .cookie-reject-link:focus-visible {
    color: rgba(251,246,241,0.85);
    text-decoration: underline;
  }
</style>
</head>
<body>
  <div id="cookie-banner" class="cookie-banner" role="dialog" aria-live="polite" aria-label="Aviso de cookies" hidden>
    <div class="cookie-banner-inner">
      <p>Usamos cookies para melhorar sua experiencia e medir o desempenho da pagina.</p>
      <div class="cookie-banner-actions">
        <button type="button" id="cookie-accept">Entendi</button>
        <button type="button" id="cookie-reject" class="cookie-reject-link">Recusar</button>
      </div>
    </div>
  </div>
  <main>
    <div class="topbar">
      <div class="wordmark">
        <span class="script">Byanca Aires</span>
        <span class="caps">Estética &amp; Camuflagem · CRBM 24200</span>
      </div>
    </div>

    <div class="hero-card reveal" style="background-image:url('img/perfil.jpg')">
      <div class="hero-card-content">
        <p class="hero-eyebrow">Devolva sua</p>
        <p class="hero-headline">autoestima</p>
        <p class="hero-sub">Método Dermo Strill® para estrias e cicatrizes · São Luís, MA</p>
        <div class="socials">
          <a href="https://www.instagram.com/drabyancaaires" target="_blank" rel="noopener noreferrer" aria-label="Instagram">IG</a>
        </div>
      </div>
    </div>

    <div class="links" id="links"></div>

    <footer>&copy; Dra. Byanca Aires</footer>
  </main>

  <script>
    // Cada item só aparece na página quando "active: true".
    // Pra publicar um bloco novo (curso, LP de procedimentos, blog...),
    // basta adicionar um objeto aqui com active: true — não precisa mexer em HTML/CSS.
    var LINKS = [
      {
        active: true,
        photo: "img/bg/bg-consulta.jpg",
        photoPos: "78% 52%",
        title: "Agendar consulta",
        desc: "Fale direto com a equipe pelo WhatsApp e marque seu horário.",
        cta: "Chamar no WhatsApp",
        href: "https://wa.me/5598981109411?text=Ol%C3%A1%21%20Vim%20pelo%20Instagram%20e%20quero%20agendar%20uma%20avalia%C3%A7%C3%A3o.",
        trackEvent: "contato_whatsapp"
      },
      {
        active: true,
        photo: "img/bg/bg-site.jpg",
        photoPos: "63% 27%",
        title: "Site oficial",
        desc: "Conheça a clínica, a Dra. Byanca e agende sua avaliação.",
        cta: "Visitar site",
        href: "https://drabyancaaires.com.br",
        trackEvent: "clique_site"
      },
      {
        active: true,
        photo: "img/bg/bg-curso-slz.jpg",
        badge: "25–27 SET",
        title: "Curso em São Luís",
        desc: "<strong>Apenas 3 dias, de 25 a 27 de setembro.</strong> Vagas limitadas para a técnica exclusiva Dermo Strill®, direto de quem criou o método.",
        cta: "Garantir minha vaga",
        href: "https://wa.me/5598981109411?text=Ol%C3%A1%21%20Tenho%20interesse%20no%20curso%20em%20S%C3%A3o%20Lu%C3%ADs%20(25%2C%2026%20e%2027%20de%20setembro)%20e%20quero%20saber%20mais.",
        trackEvent: "interesse_curso_slz"
      },
      {
        active: true,
        soon: true, // curso ainda não tem data/conteúdo definido — card em "em breve"
        photo: "img/bg/bg-curso-imp.jpg",
        photoPos: "70% 30%",
        title: "Curso em Imperatriz",
        desc: "Formação com a Dra. Byanca Aires.",
        cta: "Em breve",
        href: "#",
        trackEvent: "interesse_curso_itz"
      }
    ];

    var container = document.getElementById("links");
    LINKS.filter(function (l) { return l.active; }).forEach(function (l, i) {
      var a = document.createElement("a");
      a.className = "link-card reveal" + (l.soon ? " is-soon" : "");
      a.style.transitionDelay = (i * 0.08) + "s";
      a.href = l.href;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      if (l.soon) { a.addEventListener("click", function (e) { e.preventDefault(); }); }
      if (l.trackEvent && !l.soon) {
        a.addEventListener("click", function () {
          window.dataLayer = window.dataLayer || [];
          window.dataLayer.push({ event: l.trackEvent, link_title: l.title, link_href: l.href });
        });
      }
      a.innerHTML =
        '<span class="link-card-text">' +
          '<h3>' + l.title + '</h3>' +
          '<p>' + l.desc + '</p>' +
          '<span class="link-card-cta">' + l.cta + (l.soon ? '' : ' &rarr;') + '</span>' +
        '</span>' +
        (l.video
          ? '<span class="link-card-photo"><video class="link-card-video" src="' + l.video + '" poster="' + (l.photo || '') + '" autoplay muted loop playsinline preload="metadata"></video></span>'
          : (l.photo ? '<span class="link-card-photo" style="background-image:url(\'' + l.photo + '\');background-position:' + (l.photoPos || 'center 15%') + '">' + (l.badge ? '<span class="link-card-date-badge">' + l.badge + '</span>' : '') + '</span>' : '<span class="link-card-photo link-card-photo-empty"></span>'));
      container.appendChild(a);
    });

    // Ativa as animações de entrada conforme os elementos entram na tela
    var revealEls = document.querySelectorAll(".reveal");
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add("is-visible");
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15, rootMargin: "0px 0px -40px 0px" });
    revealEls.forEach(function (el) { io.observe(el); });
  </script>
<script>
(function () {
  var banner = document.getElementById('cookie-banner');
  var acceptBtn = document.getElementById('cookie-accept');
  var rejectBtn = document.getElementById('cookie-reject');
  if (!banner) return;
  var consent = localStorage.getItem('cookie_consent');
  if (!consent) { banner.hidden = false; }
  acceptBtn.addEventListener('click', function () {
    localStorage.setItem('cookie_consent', 'accepted');
    banner.hidden = true;
    if (typeof loadGTM === 'function') { loadGTM(); }
  });
  rejectBtn.addEventListener('click', function () {
    localStorage.setItem('cookie_consent', 'rejected');
    banner.hidden = true;
  });
})();
</script>
</body>
</html>
