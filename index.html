<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dra. Byanca Aires</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fbf6f1;
    --cream-2: #f4ebe1;
    --brown-deep: #3a2a20;
    --brown-soft: #6b4f3f;
    --accent: #8a5a45;
    --accent-dark: #6f4636;
    --border: rgba(138, 90, 69, 0.18);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Poppins", sans-serif;
    background: linear-gradient(180deg, var(--cream) 0%, var(--cream-2) 100%);
    color: var(--brown-deep);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 20px 64px;
  }
  main {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  .avatar {
    width: 104px;
    height: 104px;
    border-radius: 50%;
    overflow: hidden;
    margin: 0 auto 18px;
    border: 3px solid #fff;
    box-shadow: 0 8px 24px rgba(58, 42, 32, 0.18);
  }
  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: 1.5rem;
    margin: 0 0 6px;
  }
  .bio {
    font-size: 0.92rem;
    color: var(--brown-soft);
    line-height: 1.5;
    margin: 0 0 32px;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .link-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    text-decoration: none;
    color: var(--brown-deep);
    font-weight: 500;
    font-size: 0.98rem;
    text-align: left;
    box-shadow: 0 3px 10px rgba(58, 42, 32, 0.06);
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }
  .link-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(58, 42, 32, 0.14);
    border-color: var(--accent);
  }
  .link-btn.primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .link-btn.primary:hover {
    background: var(--accent-dark);
  }
  .link-icon {
    width: 34px;
    height: 34px;
    flex: 0 0 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: var(--cream-2);
    font-size: 1.1rem;
  }
  .link-btn.primary .link-icon {
    background: rgba(255,255,255,0.2);
  }
  .link-text strong {
    display: block;
    font-size: 0.98rem;
  }
  .link-text span {
    display: block;
    font-size: 0.78rem;
    opacity: 0.75;
    margin-top: 2px;
  }
  footer {
    margin-top: 40px;
    font-size: 0.72rem;
    color: var(--brown-soft);
    opacity: 0.7;
  }
</style>
</head>
<body>
  <main>
    <div class="avatar">
      <img src="img/perfil.jpg" alt="Dra. Byanca Aires" />
    </div>
    <h1>Dra. Byanca Aires</h1>
    <p class="bio">Biomédica CRBM 24200 · Estética e Camuflagem · São Luís, MA</p>

    <div class="links">
      <a class="link-btn primary" href="https://drabyancaaires.com.br" target="_blank" rel="noopener noreferrer">
        <span class="link-icon">🌐</span>
        <span class="link-text">
          <strong>Site oficial</strong>
          <span>Conheça a clínica e agende sua avaliação</span>
        </span>
      </a>

      <a class="link-btn" href="https://wa.me/5598981109411?text=Ol%C3%A1%21%20Vim%20pelo%20Instagram%20e%20quero%20agendar%20uma%20avalia%C3%A7%C3%A3o." target="_blank" rel="noopener noreferrer">
        <span class="link-icon">💬</span>
        <span class="link-text">
          <strong>Agendar pelo WhatsApp</strong>
          <span>Fale direto com a equipe</span>
        </span>
      </a>
    </div>

    <footer>&copy; Dra. Byanca Aires</footer>
  </main>
</body>
</html>
